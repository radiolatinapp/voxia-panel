<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Voxia logo">
  <defs>
    <linearGradient id="vbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233f"/>
      <stop offset=".55" stop-color="#0d1730"/>
      <stop offset="1" stop-color="#070c1a"/>
    </linearGradient>
    <linearGradient id="vbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc25e"/>
      <stop offset=".5" stop-color="#ff9435"/>
      <stop offset="1" stop-color="#ff5e3a"/>
    </linearGradient>
    <radialGradient id="vglow" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#ff9435" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ff9435" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".16"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="114" height="114" rx="28" fill="url(#vbg)"/>
  <rect x="3.75" y="3.75" width="112.5" height="112.5" rx="27" fill="none" stroke="url(#vring)" stroke-width="1.5"/>
  <ellipse cx="60" cy="50" rx="34" ry="30" fill="url(#vglow)"/>
  <!-- refined waveform: symmetric bars suggesting a voiceprint V -->
  <g fill="url(#vbar)">
    <rect x="27" y="46" width="7.5" height="28" rx="3.75"/>
    <rect x="40.5" y="37" width="7.5" height="46" rx="3.75"/>
    <rect x="54" y="52" width="7.5" height="24" rx="3.75"/>
    <rect x="67.5" y="30" width="7.5" height="60" rx="3.75"/>
    <rect x="81" y="42" width="7.5" height="36" rx="3.75"/>
  </g>
  <!-- voice dot with halo -->
  <circle cx="71" cy="94" r="10" fill="#ff9435" opacity=".22"/>
  <circle cx="71" cy="94" r="5.5" fill="#ffffff"/>
  <!-- wordmark tick -->
  <rect x="40" y="94" width="20" height="5.5" rx="2.75" fill="url(#vbar)" opacity=".9"/>
</svg>
